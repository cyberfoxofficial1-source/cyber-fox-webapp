<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Fox V2 - Real Project</title>
    <script src="https://cdn.jsdelivr.net/npm/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0c10;
            --text-color: #ffffff;
            --accent-orange: #ff6b00;
            --sub-text: #858585;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background: radial-gradient(circle at top, #1f1e26 0%, #0b0c10 80%);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            overflow: hidden;
        }

        /* Top Header Area */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            z-index: 10;
        }

        .project-info {
            display: flex;
            flex-direction: column;
        }

        .project-title {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .project-subtitle {
            font-size: 0.75rem;
            color: var(--sub-text);
            margin-top: 2px;
        }

        /* Minimalist Wallet Button in Corner */
        .wallet-corner-btn {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .wallet-corner-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .wallet-icon-svg {
            width: 16px;
            height: 16px;
            fill: #4c94ff; /* Professional Web3 Blue */
        }

        .wallet-text {
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* Main Hamster Kombat Style Dashboard */
        .main-display {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        /* Clean Token Display (No Boxes/Grids) */
        .token-balance-container {
            text-align: center;
        }

        .token-amount {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .token-label {
            font-size: 0.85rem;
            color: var(--sub-text);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: -5px;
        }

        /* Central Project Logo Sphere */
        .main-logo-sphere {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff6b00 0%, #1f1e26 70%);
            box-shadow: 0 0 40px rgba(255, 107, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .main-logo-sphere:active {
            transform: scale(0.96);
        }

        .main-logo-sphere img {
            width: 75%;
            height: 75%;
            object-fit: contain;
        }

        /* Control / Info Area */
        .control-panel {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .key-status {
            font-size: 0.9rem;
            color: #ffcc00;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .action-btn {
            width: 100%;
            background: linear-gradient(90deg, #ff6b00 0%, #ff8c00 100%);
            border: none;
            padding: 16px;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 107, 0, 0.4);
        }

        .action-btn:disabled {
            background: #2a2a30;
            color: #555;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Real Alert Popup Styles */
        .custom-popup {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .popup-content {
            background: #1a1b22;
            border: 1px solid rgba(255,255,255,0.1);
            width: 85%;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
        }

        .popup-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .popup-text {
            color: var(--sub-text);
            font-size: 0.95rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .popup-close-btn {
            background: var(--text-color);
            color: var(--bg-color);
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Header Section -->
        <div class="header">
            <div class="project-info">
                <span class="project-title">Cyber Fox</span>
                <span class="project-subtitle">Secure Matrix Node</span>
            </div>
            
            <!-- Minimalist Wallet Connector in Corner -->
            <div class="wallet-corner-btn" id="walletBtn">
                <svg class="wallet-icon-svg" viewBox="0 0 24 24">
                    <path d="M21 18c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V6c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v4h-9c-1.11 0-2 .9-2 2v2c0 1.1.89 2 2 2h9v4zm-9-6h10v2H12v-2zm7 1c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/>
                </svg>
                <span class="wallet-text" id="walletText">Connect</span>
            </div>
        </div>

        <!-- Main Display (Hamster Kombat Style) -->
        <div class="main-display">
            
            <!-- Clean Token Balance over the logo -->
            <div class="token-balance-container">
                <div class="token-amount" id="tokenDisplay">28,063</div>
                <div class="token-label">$FOX Tokens</div>
            </div>

            <!-- Central Token Sphere Logo -->
            <div class="main-logo-sphere" id="logoTap">
                <!-- Replace with your actual project logo image -->
                <img src="https://i.postimg.com/pX48Z9g0/fox-logo.png" alt="Cyber Fox Logo">
            </div>

        </div>

        <!-- Lower Control Area -->
        <div class="control-panel">
            <div class="key-status">
                🔑 Available Keys: <span id="keyDisplay">2</span>
            </div>
            <button class="action-btn" id="spinBtn">Launch Premium Spin</button>
        </div>

    </div>

    <!-- Custom System Alert Popup (Replaces old block system) -->
    <div class="custom-popup" id="alertPopup">
        <div class="popup-content">
            <div class="popup-title" id="popupTitle">Notification</div>
            <div class="popup-text" id="popupMessage">Message text goes here.</div>
            <button class="popup-close-btn" id="popupClose">OK</button>
        </div>
    </div>

    <script>
        // Real Project State (Directly tie to backend/database later)
        let userState = {
            tokens: 28063,
            keys: 2, // User currently has 2 keys as seen in screenshot
        };

        // DOM Elements
        const tokenDisplay = document.getElementById('tokenDisplay');
        const keyDisplay = document.getElementById('keyDisplay');
        const spinBtn = document.getElementById('spinBtn');
        const logoTap = document.getElementById('logoTap');
        const alertPopup = document.getElementById('alertPopup');
        const popupTitle = document.getElementById('popupTitle');
        const popupMessage = document.getElementById('popupMessage');
        const popupClose = document.getElementById('popupClose');

        // Render Values
        function updateUI() {
            tokenDisplay.innerText = userState.tokens.toLocaleString();
            keyDisplay.innerText = userState.keys;
        }

        // Show Custom Popup
        function showPopup(title, message) {
            popupTitle.innerText = title;
            popupMessage.innerText = message;
            alertPopup.style.display = 'flex';
        }

        // Close Popup
        popupClose.addEventListener('click', () => {
            alertPopup.style.display = 'none';
        });

        // Real Premium Spin Logic: Only depends on Keys!
        spinBtn.addEventListener('click', () => {
            if (userState.keys > 0) {
                // Deduct 1 key and spin
                userState.keys -= 1;
                updateUI();
                
                // Simulate Real Spin Rewards
                const rewards = [500, 1000, 2500, 5000];
                const won = rewards[Math.floor(Math.random() * rewards.length)];
                
                userState.tokens += won;
                
                showPopup("🎰 Spin Success!", `You used 1 Key and won ${won} $FOX Tokens!`);
                setTimeout(updateUI, 500);
            } else {
                // If user has 0 keys
                showPopup("No Keys Left", "You need at least 1 Key to run the Premium Spin wheel.");
            }
        });

        // Simple Tapper simulation for the logo
        logoTap.addEventListener('click', () => {
            userState.tokens += 1;
            updateUI();
        });

        // Initialize App
        updateUI();
    </script>
</body>
</html>
