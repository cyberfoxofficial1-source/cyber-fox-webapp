<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Fox</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
background:#0f172a;
color:white;
height:100vh;
overflow:hidden;
}

/* Loading Screen */

#loading{
position:fixed;
width:100%;
height:100%;
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:999;
}

.logo{
font-size:70px;
animation:pulse 1s infinite;
}

.loading-text{
margin-top:15px;
font-size:20px;
color:#38bdf8;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.1);}
100%{transform:scale(1);}
}

/* Main App */

#app{
display:none;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.card{
background:#1e293b;
padding:30px;
border-radius:25px;
width:90%;
max-width:350px;
text-align:center;
box-shadow:0 0 25px rgba(59,130,246,0.4);
}

.card h1{
margin-bottom:10px;
font-size:32px;
}

.card p{
opacity:0.8;
}

</style>
</head>

<body>

<div id="loading">

<div class="logo">🦊</div>

<div class="loading-text">
Loading Cyber Fox...
</div>

</div>

<div id="app">

<div class="card">

<h1>Cyber Fox</h1>

<p>Welcome to Telegram Crypto App 🚀</p>

</div>

</div>

<script>

setTimeout(() => {

document.getElementById("loading").style.display="none";

document.getElementById("app").style.display="flex";

}, 3000);

</script>

</body>
</html>
