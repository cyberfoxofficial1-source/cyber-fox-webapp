<!DOCTYPE html>
<html>

<head>
<title>Cyber Fox</title>

<style>

body{
background:#020c2b;
color:white;
font-family:sans-serif;
text-align:center;
padding-top:40px;
}

h1{
font-size:45px;
}

.balance{
font-size:35px;
margin-top:20px;
color:#38bdf8;
font-weight:bold;
}

.level{
font-size:22px;
margin-bottom:30px;
}

.fox{
font-size:120px;
cursor:pointer;
transition:0.1s;
user-select:none;
}

.fox:active{
transform:scale(0.9);
}

button{
padding:15px;
font-size:18px;
border:none;
border-radius:12px;
margin-top:30px;
background:#2563eb;
color:white;
width:250px;
}

</style>
</head>

<body>

<h1>Cyber Fox</h1>

<div class="balance" id="balance">
0 FOX
</div>

<div class="level" id="level">
Level 1
</div>

<div class="fox" onclick="mine()">
🦊
</div>

<button onclick="boost()">
⚡ Booster (50 FOX)
</button>

<script>

let balance = 0;
let level = 1;
let power = 1;

function mine(){

balance += power;

document.getElementById("balance").innerHTML =
balance + " FOX";

}

function boost(){

if(balance >= 50){

balance -= 50;

level += 1;

power += 1;

document.getElementById("balance").innerHTML =
balance + " FOX";

document.getElementById("level").innerHTML =
"Level " + level;

alert("Booster Activated 🚀");

}else{

alert("Need 50 FOX");

}

}

</script>

</body>
</html>
