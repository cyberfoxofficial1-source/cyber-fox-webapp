<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Fox</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
background:#000f3b;
color:white;
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
}

/* Loading */

#loading{
position:fixed;
width:100%;
height:100%;
background:#07142e;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:999;
}

.loader{
width:70px;
height:70px;
border-radius:50%;
border:6px solid #1f3f80;
border-top:6px solid #3aa7ff;
animation:spin 1s linear infinite;
box-shadow:0 0 30px #3aa7ff;
}

.loading-text{
margin-top:20px;
font-size:22px;
color:#4db8ff;
font-weight:bold;
letter-spacing:2px;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

/* Main */

#app{
display:none;
width:100%;
text-align:center;
padding:20px;
}

.title{
font-size:55px;
font-weight:bold;
margin-bottom:15px;
}

#foxCount{
font-size:60px;
font-weight:bold;
color:#2db7ff;
margin-bottom:15px;
text-shadow:0 0 20px #2db7ff;
}

#level{
font-size:30px;
margin-bottom:35px;
}

/* Fox Button */

#tapBtn{
width:290px;
height:290px;
border-radius:50%;
background:linear-gradient(145deg,#2d66ff,#244dc7);
display:flex;
justify-content:center;
align-items:center;
margin:auto;
cursor:pointer;
user-select:none;
transition:0.1s;
box-shadow:
0 0 20px #2d66ff,
0 0 50px #2d66ff,
0 0 90px #2d66ff;
animation:pulse 2s infinite;
}

#tapBtn img{
width:190px;
pointer-events:none;
}

#tapBtn:active{
transform:scale(0.92);
}

@keyframes pulse{
0%{
box-shadow:0 0 20px #2d66ff;
}
50%{
box-shadow:
0 0 40px #2d66ff,
0 0 90px #2d66ff;
}
100%{
box-shadow:0 0 20px #2d66ff;
}
}

/* Booster */

#boosterBtn{
margin-top:45px;
padding:22px 40px;
font-size:30px;
border:none;
border-radius:20px;
background:#2d66ff;
color:white;
font-weight:bold;
cursor:pointer;
box-shadow:0 0 25px #2d66ff;
}

/* Floating + */

.plusOne{
position:absolute;
font-size:55px;
font-weight:bold;
color:#29b6ff;
animation:floatUp 0.8s linear forwards;
pointer-events:none;
text-shadow:0 0 15px #29b6ff;
}

@keyframes floatUp{
0%{
opacity:1;
transform:translateY(0);
}
100%{
opacity:0;
transform:translateY(-120px);
}
}

</style>
</head>

<body>

<!-- Loading -->

<div id="loading">
<div class="loader"></div>
<div class="loading-text">CYBER FOX</div>
</div>

<!-- App -->

<div id="app">

<div class="title">🦊 Cyber Fox</div>

<div id="foxCount">0 FOX</div>

<div id="level">Level 1</div>

<div id="tapBtn">
<img src="https://cdn-icons-png.flaticon.com/512/616/616554.png">
</div>

<button id="boosterBtn">
⚡ Booster (50 FOX)
</button>

</div>

<script>

setTimeout(() => {
document.getElementById("loading").style.display = "none";
document.getElementById("app").style.display = "block";
}, 2500);

let fox = 0;
let level = 1;
let power = 1;
let boosterCost = 50;

const foxCount = document.getElementById("foxCount");
const levelText = document.getElementById("level");
const tapBtn = document.getElementById("tapBtn");
const boosterBtn = document.getElementById("boosterBtn");

function updateUI(){

foxCount.innerText = fox + " FOX";

level = Math.floor(fox / 100) + 1;

levelText.innerText = "Level " + level;

boosterBtn.innerText =
"⚡ Booster (" + boosterCost + " FOX)";
}

tapBtn.addEventListener("click", () => {

fox += power;

updateUI();

const plus = document.createElement("div");

plus.innerText = "+" + power;

plus.classList.add("plusOne");

document.body.appendChild(plus);

plus.style.left =
(window.innerWidth / 2 - 40) + "px";

plus.style.top =
(window.innerHeight / 2 + 40) + "px";

setTimeout(() => {
plus.remove();
}, 800);

});

boosterBtn.addEventListener("click", () => {

if(fox >= boosterCost){

fox -= boosterCost;

power += 1;

boosterCost += 50;

updateUI();

alert("⚡ Booster Upgraded!");

}
else{

alert("Not enough FOX!");

}

});

updateUI();

</script>

</body>
</html>
