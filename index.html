<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Fox V2</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:white;
  text-align:center;
}

header{
  padding:15px;
  background:#1a1a1a;
  font-size:22px;
  font-weight:bold;
}

.home{ padding:20px; }

.coin-box{
  margin:20px auto;
  padding:20px;
  background:#222;
  border-radius:10px;
  width:220px;
}

.task-box{
  background:#222;
  margin:10px;
  padding:15px;
  border-radius:10px;
}

button{
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.nav{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  background:#1a1a1a;
}

.nav button{
  flex:1;
  background:none;
  color:white;
}

/* detail page */
#detail-page{
  display:none;
  padding:20px;
}

.follow-btn{
  background:white;
  color:black;
  width:90%;
  margin:10px;
}

.claim-btn{
  width:90%;
  margin:10px;
  background:gray;
  color:white;
}
</style>
</head>

<body>

<header>🦊 Cyber Fox V2</header>

<!-- HOME -->
<div id="home-page">
  <div class="coin-box">
    💰 Coins: <span id="coin">0</span>
  </div>
</div>

<!-- TASK LIST -->
<div id="tasks-page" style="display:none;">

<h2>📋 Tasks</h2>

<div class="task-box">
  <p>🐦 Follow X</p>
  <button onclick="openTask('Follow X Account',2000,'https://x.com/FoxCyber136')">Go</button>
</div>

<div class="task-box">
  <p>📘 Facebook</p>
  <button onclick="openTask('Follow Facebook',3000,'https://facebook.com/share/1Cw6CQRDma/')">Go</button>
</div>

<div class="task-box">
  <p>▶️ YouTube</p>
  <button onclick="openTask('Subscribe YouTube',5000,'https://youtube.com/@cyberfoxofficial')">Go</button>
</div>

</div>

<!-- DETAIL PAGE -->
<div id="detail-page">

<h2 id="task-title">Task</h2>

<div class="task-box">
  💰 Reward: <span id="task-reward">0</span> Coins
</div>

<a id="task-link" target="_blank">
  <button class="follow-btn" onclick="markFollowed()">FOLLOW</button>
</a>

<button id="claim-btn" class="claim-btn" onclick="claimTask()" disabled>
  CLAIM REWARD
</button>

</div>

<!-- NAV -->
<div class="nav">
<button onclick="showHome()">Home</button>
<button onclick="showTasks()">Tasks</button>
</div>

<script>

let coins = Number(localStorage.getItem("coins")) || 0;
let currentReward = 0;
let taskFollowed = false;

function updateUI(){
  document.getElementById("coin").innerText = coins;
}

/* NAV */
function showHome(){
  document.getElementById("home-page").style.display="block";
  document.getElementById("tasks-page").style.display="none";
  document.getElementById("detail-page").style.display="none";
}

function showTasks(){
  document.getElementById("home-page").style.display="none";
  document.getElementById("tasks-page").style.display="block";
  document.getElementById("detail-page").style.display="none";
}

/* OPEN TASK */
function openTask(title, reward, link){
  document.getElementById("home-page").style.display="none";
  document.getElementById("tasks-page").style.display="none";
  document.getElementById("detail-page").style.display="block";

  document.getElementById("task-title").innerText = title;
  document.getElementById("task-reward").innerText = reward;
  document.getElementById("task-link").href = link;

  currentReward = reward;
  taskFollowed = false;

  document.getElementById("claim-btn").disabled = true;
  document.getElementById("claim-btn").style.background="gray";
}

/* FOLLOW CLICK */
function markFollowed(){
  taskFollowed = true;
  document.getElementById("claim-btn").disabled = false;
  document.getElementById("claim-btn").style.background="linear-gradient(90deg,#00c853,#00e676)";
}

/* CLAIM */
function claimTask(){
  if(!taskFollowed){
    alert("Please follow first!");
    return;
  }

  coins += currentReward;
  localStorage.setItem("coins", coins);
  updateUI();

  alert("Reward Claimed +"+currentReward);

  showTasks();
}

/* INIT */
window.onload = function(){
  updateUI();
};

</script>

</body>
</html>
