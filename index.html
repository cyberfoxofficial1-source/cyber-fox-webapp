<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Fox V2</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:white;
  text-align:center;
}

header{
  padding:15px;
  background:#1a1a1a;
  font-size:22px;
  font-weight:bold;
}

.home{
  padding:20px;
}

.coin-box{
  margin:20px auto;
  padding:20px;
  background:#222;
  border-radius:10px;
  width:220px;
}

.fox-logo{
  width:280px;
  border-radius:50%;
  cursor:pointer;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.08);}
  100%{transform:scale(1);}
}

/* CHECKIN */
.checkin-box{
  background:#222;
  margin:15px;
  padding:15px;
  border-radius:12px;
  text-align:left;
}

.day{
  background:#111;
  padding:8px;
  margin:6px 0;
  border-radius:6px;
  font-size:14px;
}

/* TASK */
.task-box{
  background:#222;
  margin:10px;
  padding:15px;
  border-radius:10px;
}

/* SPIN WHEEL */
#wheel{
  width:150px;
  height:150px;
  margin:20px auto;
  border-radius:50%;
  background:#333;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:60px;
  transition: transform 2s ease-out;
}

/* NAV */
.nav{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  background:#1a1a1a;
}

.nav button{
  flex:1;
  padding:15px;
  background:none;
  border:none;
  color:white;
}
</style>
</head>

<body>

<header>🦊 Cyber Fox V2</header>

<!-- HOME -->
<div id="home-page" class="home">
  <h2>Home</h2>

  <div class="coin-box">
    💰 Coins: <span id="coin">0</span>
  </div>

  <img class="fox-logo"
  src="https://raw.githubusercontent.com/cyberfoxofficial1-source/cyber-fox-webapp/main/Orange%20Abstract%20Illustrative%20Esports%20Fox%20Gaming%20Logo_20260604_102333_0000.png"
  onclick="addCoins(1)">
</div>

<!-- TASKS -->
<div id="tasks-page" style="display:none;">

<h2>📋 Tasks</h2>

<div class="checkin-box">
<h3>🎁 7 Days Check-in Rewards</h3>

<div class="day">Day 1: 1K coin</div>
<div class="day">Day 2: 3K coin + 5 Spins</div>
<div class="day">Day 3: 5K coin</div>
<div class="day">Day 4: 10K coin</div>
<div class="day">Day 5: 15K coin + 20 Spins</div>
<div class="day">Day 6: 30K coin</div>
<div class="day">Day 7: 50K coin + Premium Key 🔑</div>

<button onclick="checkIn()">Claim</button>
</div>

<!-- SPIN -->
<div id="spin-page" style="display:none;">

<h2>🎡 Spin Wheel</h2>

<div id="wheel">🎡</div>

<div class="task-box">
<button onclick="spin()">SPIN</button>
<p id="spin-result">Spin করে রিওয়ার্ড নাও</p>
</div>

</div>

</div>

<!-- NAV -->
<div class="nav">
<button onclick="showHome()">Home</button>
<button onclick="showTasks()">Tasks</button>
<button onclick="showSpin()">Spin</button>
<button>Wallet</button>
</div>

<script>

let coins = Number(localStorage.getItem("coins")) || 0;
let lastCheckin = localStorage.getItem("lastCheckin");
let checkinDay = Number(localStorage.getItem("checkinDay")) || 1;

function updateUI(){
  document.getElementById("coin").innerText = coins;
}

/* ADD COINS */
function addCoins(amount){
  coins += amount;
  localStorage.setItem("coins", coins);
  updateUI();
}

/* PAGE CONTROL */
function showHome(){
  document.getElementById("home-page").style.display = "block";
  document.getElementById("tasks-page").style.display = "none";
  document.getElementById("spin-page").style.display = "none";
}

function showTasks(){
  document.getElementById("home-page").style.display = "none";
  document.getElementById("tasks-page").style.display = "block";
  document.getElementById("spin-page").style.display = "none";
}

function showSpin(){
  document.getElementById("home-page").style.display = "none";
  document.getElementById("tasks-page").style.display = "none";
  document.getElementById("spin-page").style.display = "block";
}

/* SPIN */
function spin(){
  let wheel = document.getElementById("wheel");

  let rewards = [0, 10, 50, 100, 500, 1000];
  let reward = rewards[Math.floor(Math.random() * rewards.length)];

  let rotate = 720 + Math.floor(Math.random() * 360);
  wheel.style.transform = "rotate(" + rotate + "deg)";

  setTimeout(() => {
    coins += reward;
    localStorage.setItem("coins", coins);
    updateUI();

    document.getElementById("spin-result").innerText =
      "🎉 You got " + reward + " coins!";
  }, 2000);
}

/* CHECK-IN */
function checkIn(){
  let today = new Date().toDateString();

  if(lastCheckin === today){
    alert("Already claimed today!");
    return;
  }

  let reward = 0;

  if(checkinDay == 1) reward = 1000;
  else if(checkinDay == 2) reward = 3000;
  else if(checkinDay == 3) reward = 5000;
  else if(checkinDay == 4) reward = 10000;
  else if(checkinDay == 5) reward = 15000;
  else if(checkinDay == 6) reward = 30000;
  else if(checkinDay == 7) reward = 50000;

  coins += reward;

  localStorage.setItem("coins", coins);
  localStorage.setItem("lastCheckin", today);

  checkinDay++;
  if(checkinDay > 7) checkinDay = 1;

  localStorage.setItem("checkinDay", checkinDay);

  updateUI();

  alert("You got " + reward + " coins!");
}

/* LOAD */
window.onload = function(){
  updateUI();
}

</script>

</body>
  </html>
