<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Fox V3</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:white;
  text-align:center;
}

header{
  padding:15px;
  background:#1a1a1a;
  font-size:22px;
  font-weight:bold;
}

/* BOX */
.box{
  background:#222;
  margin:15px;
  padding:15px;
  border-radius:10px;
}

/* BUTTON */
button{
  padding:10px;
  border:none;
  border-radius:8px;
  background:#00c853;
  color:white;
  font-weight:bold;
  cursor:pointer;
  width:100%;
  margin-top:5px;
}

/* NAV */
.nav{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  background:#1a1a1a;
}

.nav button{
  flex:1;
  background:none;
}
</style>
</head>

<body>

<header>🦊 Cyber Fox V3</header>

<!-- HOME -->
<div id="home">

  <div class="box">
    💰 Coins: <span id="coins">0</span>
  </div>

  <div class="box">
    🔗 Wallet:
    <p id="wallet">Not Connected</p>
    <button onclick="connectWallet()">Connect Wallet</button>
  </div>

  <div class="box">
    🎁 Daily Bonus (7 Days)
    <p id="dayText">Day 1</p>
    <button onclick="dailyBonus()">Claim Bonus</button>
  </div>

  <div class="box">
    🎡 Spin Wheel
    <button onclick="spin()">SPIN</button>
    <p id="spinResult"></p>
  </div>

</div>

<!-- NAV -->
<div class="nav">
<button onclick="alert('Home')">Home</button>
<button onclick="alert('Tasks')">Tasks</button>
<button onclick="alert('Wallet')">Wallet</button>
</div>

<script>

let coins = Number(localStorage.getItem("coins")) || 0;
let wallet = localStorage.getItem("wallet") || "Not Connected";
let day = Number(localStorage.getItem("day")) || 1;
let lastClaim = localStorage.getItem("lastClaim");

function update(){
  document.getElementById("coins").innerText = coins;
  document.getElementById("wallet").innerText = wallet;
  document.getElementById("dayText").innerText = "Day " + day;
}

/* WALLET CONNECT (REAL META MASK) */
async function connectWallet(){
  if(window.ethereum){
    let accounts = await window.ethereum.request({
      method: "eth_requestAccounts"
    });

    wallet = accounts[0];
    localStorage.setItem("wallet", wallet);
    update();
  } else {
    alert("MetaMask not found!");
  }
}

/* DAILY BONUS FIXED */
function dailyBonus(){

  let today = new Date().toDateString();

  if(lastClaim === today){
    alert("Already claimed today!");
    return;
  }

  let reward = 0;

  if(day == 1) reward = 1000;
  else if(day == 2) reward = 2000;
  else if(day == 3) reward = 3000;
  else if(day == 4) reward = 5000;
  else if(day == 5) reward = 10000;
  else if(day == 6) reward = 20000;
  else if(day == 7) reward = 50000;

  coins += reward;

  lastClaim = today;
  day++;

  if(day > 7) day = 1;

  localStorage.setItem("coins", coins);
  localStorage.setItem("day", day);
  localStorage.setItem("lastClaim", lastClaim);

  update();

  alert("You got " + reward + " coins!");
}

/* SPIN */
function spin(){

  let rewards = [500,1000,1500,2000,2500,"BOX"];
  let result = rewards[Math.floor(Math.random()*rewards.length)];

  if(result === "BOX"){
    alert("You got BOX!");
  } else {
    coins += result;
    localStorage.setItem("coins", coins);
    update();
    document.getElementById("spinResult").innerText =
      "You got " + result + " coins!";
  }
}

/* LOAD */
window.onload = update;

</script>

</body>
</html>
