<!DOCTYPE html>
<html>
<head>
<title>Cyber Fox</title>
</head>

<body
  style="background:#0f172a;color:white;text-align:center;font-family:sans-serif;">

<h1>🦊 Cyber Fox</h1>

<h2 id="balance">0 FOX</h2>

<h3 id="level">Level 1</h3>

<button onclick="mine()" 
  style="padding:15px;font-size:20px;">
⛏ Mine FOX
</button>
<br><br>

<button onclick="boost()" 
  style="padding:15px;font-size:20px;">
⚡ Booster (50 FOX)
</button>

<script>

let balance = 0;
let level = 1;
let power = 1;

function mine(){

balance += power;

document.getElementById("balance").innerHTML =
balance + " FOX";

}

function boost(){

if(balance >= 50){

balance -= 50;
level += 1;
power += 1;

document.getElementById("balance").innerHTML =
balance + " FOX";

document.getElementById("level").innerHTML =
"Level " + level;

alert("Booster Activated 🚀");

}else{

alert("Need 50 FOX");

}

}

</script>

</body>
</html>
