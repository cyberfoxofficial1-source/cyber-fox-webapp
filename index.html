<!DOCTYPE html>
<html>

<head>
<title>Cyber Fox</title>

<style>

body{
margin:0;
padding:0;
background:#020c2b;
font-family:sans-serif;
color:white;
text-align:center;
overflow:hidden;
}

.container{
padding-top:40px;
}

h1{
font-size:45px;
margin-bottom:20px;
}

.balance{
font-size:38px;
font-weight:bold;
color:#38bdf8;
margin-bottom:10px;
}

.level{
font-size:22px;
margin-bottom:35px;
color:#cbd5e1;
}

.fox-box{
display:flex;
justify-content:center;
align-items:center;
}

.fox{
width:190px;
height:190px;
border-radius:50%;
background:radial-gradient(circle,#2563eb,#0f172a);
display:flex;
justify-content:center;
align-items:center;
font-size:110px;
box-shadow:0 0 25px #38bdf8;
animation:pulse 2s infinite;
transition:0.08s;
user-select:none;
cursor:pointer;
}

.fox:active{
transform:scale(0.92) rotate(5deg);
box-shadow:0 0 60px #38bdf8;
}

@keyframes pulse{

0%{
transform:scale(1);
box-shadow:0 0 20px #38bdf8;
}

50%{
transform:scale(1.03);
box-shadow:0 0 60px #38bdf8;
}

100%{
transform:scale(1);
box-shadow:0 0 20px #38bdf8;
}

}

button{
margin-top:40px;
padding:16px;
width:260px;
font-size:20px;
border:none;
border-radius:15px;
background:#2563eb;
color:white;
font-weight:bold;
box-shadow:0 0 20px rgba(37,99,235,0.5);
}

button:active{
transform:scale(0.96);
}

.tap{
margin-top:20px;
font-size:18px;
color:#94a3b8;
}

</style>
</head>

<body>

<div class="container">

<h1>🦊 Cyber Fox</h1>

<div class="balance" id="balance">
0 FOX
</div>

<div class="level" id="level">
Level 1
</div>

<div class="fox-box">

<div class="fox" onclick="mine()">
🦊
</div>

</div>

<div class="tap">
Tap the Fox to Mine 🚀
</div>

<button onclick="boost()">
⚡ Booster Upgrade (50 FOX)
</button>

</div>

<script>

let balance = 0;
let level = 1;
let power = 1;

function mine(){

balance += power;

document.getElementById("balance").innerHTML =
balance + " FOX";

}

function boost(){

if(balance >= 50){

balance -= 50;

level += 1;

power += 1;

document.getElementById("balance").innerHTML =
balance + " FOX";

document.getElementById("level").innerHTML =
"Level " + level;

alert("🚀 Booster Upgraded!");

}else{

alert("❌ Need 50 FOX");

}

}

</script>

</body>
</html>
