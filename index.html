<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Fox V2 - Tap to Earn</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
  --bg-color: #0d0d0d;
  --card-bg: #151515;
  --text-color: #ffffff;
  --text-gray: #8e8e93;
  --primary-green: #5cc83b;
  --accent-gold: #ff9800;
  --glow-orange: rgba(255, 115, 0, 0.4);
}

body {
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-color: var(--bg-color);
  color: var(--text-color);
  user-select: none;
  overflow-x: hidden;
}

/* Header Section */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 15px 10px 15px;
}

.header-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 20px;
  font-weight: 700;
}

.header-title img {
  width: 28px;
  height: 28px;
  object-fit: contain;
}

.noti-btn {
  background: none;
  border: none;
  color: white;
  font-size: 20px;
  cursor: pointer;
}

/* Stats Row (Coins & Power) */
.stats-container {
  display: flex;
  gap: 15px;
  padding: 0 15px;
  margin-top: 15px;
}

.stat-box {
  flex: 1;
  background: var(--card-bg);
  padding: 12px;
  border-radius: 14px;
  border: 1px solid #1e1e1e;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.stat-label {
  font-size: 12px;
  color: var(--text-gray);
  display: flex;
  align-items: center;
  gap: 6px;
}

.stat-label i.fa-coins { color: #ffbc00; }
.stat-label i.fa-bolt { color: #ffeb3b; }

.stat-value {
  font-size: 20px;
  font-weight: 800;
}

/* Main Tap Area */
.main-clicker-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin-top: 40px;
  margin-bottom: 30px;
  position: relative;
}

.tap-instruction {
  color: var(--text-gray);
  font-size: 14px;
  margin-top: 15px;
  display: flex;
  align-items: center;
  gap: 5px;
}

.circle-outer {
  width: 250px;
  height: 250px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,115,0,0.15) 0%, rgba(0,0,0,0) 70%);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  border: 2px solid rgba(255, 115, 0, 0.2);
  box-shadow: 0 0 30px var(--glow-orange);
}

.circle-inner {
  width: 220px;
  height: 220px;
  border-radius: 50%;
  background-color: #111;
  border: 4px solid #ff7300;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.05s ease;
  position: relative;
  box-shadow: inset 0 0 20px rgba(255, 115, 0, 0.4);
}

/* Fox Image inside Clicker */
.circle-inner img {
  width: 85%;
  height: 85%;
  object-fit: contain;
  pointer-events: none;
}

/* Click effect class via JS */
.circle-inner:active {
  transform: scale(0.95);
}

/* Floating +1 Text Animation */
.floating-text {
  position: absolute;
  color: #ffb300;
  font-size: 28px;
  font-weight: 900;
  pointer-events: none;
  animation: floatUp 0.8s ease-out forwards;
  text-shadow: 0 0 8px rgba(255, 166, 0, 0.6);
  z-index: 10;
}

@keyframes floatUp {
  0% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  100% {
    opacity: 0;
    transform: translateY(-120px) scale(1.2);
  }
}

/* Energy Remaining Badge */
.energy-badge {
  background: rgba(255, 255, 255, 0.05);
  padding: 8px 16px;
  border-radius: 20px;
  border: 1px solid #222;
  font-size: 14px;
  margin-top: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Quick Info Section (Grid underneath) */
.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 0 15px;
  margin-bottom: 120px;
}

.info-card {
  background: var(--card-bg);
  border-radius: 12px;
  padding: 12px;
  border: 1px solid #1a1a1a;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  font-weight: 600;
}

.info-card i {
  font-size: 18px;
  color: var(--primary-green);
}

/* Pages Layout (Tasks, Spin, etc.) */
.page {
  padding: 0 15px 120px 15px;
}

/* Bottom Navigation Bar */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background-color: #111111;
  display: flex;
  justify-content: space-around;
  padding: 10px 0 25px 0;
  border-top: 1px solid #1c1c1e;
  z-index: 100;
}

.nav-item {
  background: none;
  border: none;
  color: var(--text-gray);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  cursor: pointer;
  width: 20%;
}

.nav-item i {
  font-size: 18px;
}

.nav-item.active {
  color: #ff7300;
}

.dummy-content {
  padding: 40px 20px;
  text-align: center;
  color: var(--text-gray);
}
</style>
</head>
<body>

<div id="main-view">
  <header>
    <div class="header-title">
      <img src="https://raw.githubusercontent.com/cyberfoxofficial1-source/cyber-fox-webapp/main/Orange%20Abstract%20Illustrative%20Esports%20Fox%20Gaming%20Logo_20260604_102333_0000.png" alt="🦊"> 
      Cyber Fox V2
    </div>
    <button class="noti-btn"><i class="fa-regular fa-bell"></i></button>
  </header>

  <div id="home-page" class="page">
    
    <div class="stats-container">
      <div class="stat-box">
        <div class="stat-label"><i class="fa-solid fa-coins"></i> Coins</div>
        <div class="stat-value" id="global-coin">1,250</div>
      </div>
      <div class="stat-box">
        <div class="stat-label"><i class="fa-solid fa-bolt"></i> Power</div>
        <div class="stat-value" id="power-percent">100%</div>
      </div>
    </div>

    <div class="main-clicker-area">
      <div class="circle-outer">
        <div class="circle-inner" id="clicker-btn">
          <img src="https://raw.githubusercontent.com/cyberfoxofficial1-source/cyber-fox-webapp/main/Orange%20Abstract%20Illustrative%20Esports%20Fox%20Gaming%20Logo_20260604_102333_0000.png" alt="Cyber Fox Logo">
        </div>
      </div>
      
      <div class="tap-instruction">
        Tap the fox and earn coins <i class="fa-solid fa-circle-nodes" style="color:#ff7300"></i>
      </div>

      <div class="energy-badge">
        <i class="fa-solid fa-hand-pointer"></i> <span id="taps-left">125</span> Taps Left
      </div>
    </div>

    <div class="info-grid">
      <div class="info-card">
        <i class="fa-solid fa-shield-halved"></i>
        <span>Secure & Safe</span>
      </div>
      <div class="info-card">
        <i class="fa-solid fa-bolt-lightning"></i>
        <span>Fast & Smooth</span>
      </div>
    </div>

  </div>

  <div id="spin-page" class="page" style="display:none;"><div class="dummy-content"><h2>🎯 Lucky Spin</h2><p>Spin the wheel and win rewards!</p></div></div>
  <div id="tasks-page" class="page" style="display:none;"><div class="dummy-content"><h2>📋 Tasks Section</h2><p>Complete community tasks here.</p></div></div>
  <div id="wallet-page" class="page" style="display:none;"><div class="dummy-content"><h2>👛 Web3 Wallet</h2><p>Connect your TON wallet here.</p></div></div>

</div>

<div class="bottom-nav">
  <button class="nav-item active" id="nav-home" onclick="switchPage('home')">
    <i class="fa-solid fa-house"></i><span>Home</span>
  </button>
  <button class="nav-item" id="nav-spin" onclick="switchPage('spin')">
    <i class="fa-solid fa-circle-dot"></i><span>Spin</span>
  </button>
  <button class="nav-item" id="nav-tasks" onclick="switchPage('tasks')">
    <i class="fa-solid fa-clipboard-list"></i><span>Tasks</span>
  </button>
  <button class="nav-item" id="nav-wallet" onclick="switchPage('wallet')">
    <i class="fa-solid fa-wallet"></i><span>Wallet</span>
  </button>
</div>

<script>
let coins = Number(localStorage.getItem("coins")) || 1250;
let maxTaps = 125;
let currentTaps = Number(localStorage.getItem("current_taps")) || 125;

const clickerBtn = document.getElementById("clicker-btn");
const coinDisplay = document.getElementById("global-coin");
const powerDisplay = document.getElementById("power-percent");
const tapsDisplay = document.getElementById("taps-left");

function updateUI() {
  coinDisplay.innerText = coins.toLocaleString();
  tapsDisplay.innerText = currentTaps;
  
  let pct = Math.floor((currentTaps / maxTaps) * 100);
  powerDisplay.innerText = pct + "%";
}

clickerBtn.addEventListener("click", function(e) {
  if (currentTaps <= 0) {
    alert("Out of Energy! Wait for it to recharge.");
    return;
  }

  coins += 1;
  currentTaps -= 1;
  
  localStorage.setItem("coins", coins);
  localStorage.setItem("current_taps", currentTaps);
  
  updateUI();

  // Floating +1 text effect
  const x = e.clientX;
  const y = e.clientY;

  const floatingText = document.createElement("div");
  floatingText.className = "floating-text";
  floatingText.innerText = "+1";
  
  floatingText.style.left = `${x - 15}px`;
  floatingText.style.top = `${y - 25}px`;

  document.body.appendChild(floatingText);

  setTimeout(() => {
    floatingText.remove();
  }, 800);
});

// Energy recharge every 3 seconds
setInterval(() => {
  if (currentTaps < maxTaps) {
    currentTaps += 1;
    localStorage.setItem("current_taps", currentTaps);
    updateUI();
  }
}, 3000);

function switchPage(pageName) {
  document.getElementById("home-page").style.display = "none";
  document.getElementById("spin-page").style.display = "none";
  document.getElementById("tasks-page").style.display = "none";
  document.getElementById("wallet-page").style.display = "none";

  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

  document.getElementById(`${pageName}-page`).style.display = "block";
  document.getElementById(`nav-${pageName}`).classList.add('active');
}

window.onload = function() {
  updateUI();
};
</script>

</body>
</html>
