<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cyber Fox V2</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    .fox-logo{
  width:280px;
  border-radius:50%;
  cursor:pointer;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.08);}
  100%{transform:scale(1);}
}
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
    }

    header {
      padding: 15px;
      text-align: center;
      background: #1a1a1a;
      font-size: 20px;
      font-weight: bold;
    }

    .home {
      padding: 20px;
      text-align: center;
    }

    .coin-box {
      margin-top: 20px;
      padding: 20px;
      background: #222;
      border-radius: 10px;
      font-size: 18px;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      display: flex;
      background: #1a1a1a;
    }

    .nav button {
      flex: 1;
      padding: 15px;
      background: none;
      color: white;
    }
  </style>
</head>

<body>

<header>
  🦊 Cyber Fox V2
</header>

<div class="home">
  <h2>Home</h2>

  <div class="coin-box">
    💰 Coins: <span id="coin">0</span>
  </div>

  <br>

<img
  class="fox-logo"
src="https://raw.githubusercontent.com/cyberfoxofficial1-source/cyber-fox-webapp/main/Orange%20Abstract%20Illustrative%20Esports%20Fox%20Gaming%20Logo_20260604_102333_0000.png" 
onclick="addCoins(1)"
>
</div>

<div class="nav">
  <button>Home</button>
  <button>Spin</button>
  <button>Tasks</button>
  <button>Wallet</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA2aFc2uxZr0eOLQgyxHUL5bRtg8I1iYUs",
  authDomain: "cyber-fox-7f9a4.firebaseapp.com",
  databaseURL: "https://cyber-fox-7f9a4-default-rtdb.firebaseio.com",
  projectId: "cyber-fox-7f9a4",
  storageBucket: "cyber-fox-7f9a4.firebasestorage.app",
  messagingSenderId: "612951080546",
  appId: "1:612951080546:web:13026f07bbacd2c3ccdb3b"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let userId = localStorage.getItem("userId");

if (!userId) {
  userId = "user_" + Math.floor(Math.random() * 999999999);
  localStorage.setItem("userId", userId);
}

let coins = 0;

function loadCoins() {
  get(child(ref(db), "users/" + userId))
    .then((snapshot) => {
      if (snapshot.exists()) {
        coins = snapshot.val().coins || 0;
      }
      document.getElementById("coin").innerText = coins;
    })
    .catch((error) => {
      console.log(error);
    });
}

function saveCoins() {
  set(ref(db, "users/" + userId), {
    coins: coins
  });
}

window.addCoins = function(amount) {
  coins += amount;
  document.getElementById("coin").innerText = coins;
  saveCoins();
};

// loadCoins();

</script>

</body>
</html>
