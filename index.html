<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Fox V2</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:white;
  text-align:center;
}

header{
  padding:15px;
  background:#1a1a1a;
  font-size:22px;
  font-weight:bold;
}

.home{
  padding:20px;
}

.coin-box{
  margin:20px auto;
  padding:20px;
  background:#222;
  border-radius:10px;
  width:220px;
}

.fox-logo{
  width:280px;
  border-radius:50%;
  cursor:pointer;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.08);}
  100%{transform:scale(1);}
}

.task-box{
  background:#222;
  margin:10px;
  padding:15px;
  border-radius:10px;
}

.task-box button{
  padding:8px 15px;
  margin-top:10px;
}

.nav{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  background:#1a1a1a;
}

.nav button{
  flex:1;
  padding:15px;
  background:none;
  border:none;
  color:white;
}
</style>
</head>

<body>

<header>
🦊 Cyber Fox V2
</header>

<!-- HOME PAGE -->
<div id="home-page" class="home">

<h2>Home</h2>

<div class="coin-box">
💰 Coins: <span id="coin">0</span>
</div>

<img class="fox-logo"
src="https://raw.githubusercontent.com/cyberfoxofficial1-source/cyber-fox-webapp/main/Orange%20Abstract%20Illustrative%20Esports%20Fox%20Gaming%20Logo_20260604_102333_0000.png"
onclick="addCoins(1)">

</div>

<!-- TASKS PAGE -->
<div id="tasks-page" style="display:none;">

<h2>📋 Tasks</h2>
  
<div class="task-box">
  <h3>🎁 Daily Check-in</h3>
  <p id="checkin-text">Loading...</p>
  <button onclick="checkIn()">Claim</button>
</div>
  
<div class="task-box">
<p>📢 Join Telegram Channel</p>
<a href="https://t.me/CyberFoxOfficial" target="_blank"><button>Go</button></a>
</div>

<div class="task-box">
<p>🐦 Follow Twitter/X</p>
<a href="https://x.com/FoxCyber136" target="_blank"><button>Go</button></a>
</div>

<div class="task-box">
<p>📘 Follow Facebook Page</p>
<a href="https://www.facebook.com/share/1Cw6CQRDma/" target="_blank"><button>Go</button></a>
</div>

<div class="task-box">
<p>▶️ Subscribe YouTube</p>
<a href="https://youtube.com/@cyberfoxofficial" target="_blank"><button>Go</button></a>
</div>

</div>

<!-- NAV -->
<div class="nav">
<button onclick="showHome()">Home</button>
<button onclick="showTasks()">Tasks</button>
<button>Spin</button>
<button>Wallet</button>
</div>

<script>

let coins = Number(localStorage.getItem("coins")) || 0;
document.getElementById("coin").innerText = coins;

function addCoins(amount){
  coins += amount;
  document.getElementById("coin").innerText = coins;
  localStorage.setItem("coins", coins);
}

function showHome(){
  document.getElementById("home-page").style.display = "block";
  document.getElementById("tasks-page").style.display = "none";
}

function showTasks(){
  document.getElementById("home-page").style.display = "none";
  document.getElementById("tasks-page").style.display = "block";
}
let lastCheckin = localStorage.getItem("lastCheckin") || 0;
let checkinDay = Number(localStorage.getItem("checkinDay")) || 1;

function updateCheckinText(){
  document.getElementById("checkin-text").innerText =
    "Day " + checkinDay + " Reward Ready";
}

updateCheckinText();

function checkIn(){
  let today = new Date().toDateString();

  if(lastCheckin === today){
    alert("Already claimed today!");
    return;
  }

  let reward = 0;

  if(checkinDay == 1) reward = 1000;
  else if(checkinDay == 2) reward = 3000;
  else if(checkinDay == 3) reward = 5000;
  else if(checkinDay == 4) reward = 10000;
  else if(checkinDay == 5) reward = 15000;
  else if(checkinDay == 6) reward = 30000;
  else if(checkinDay == 7) reward = 50000;

  coins += reward;
  document.getElementById("coin").innerText = coins;
  localStorage.setItem("coins", coins);

  localStorage.setItem("lastCheckin", today);

  checkinDay++;
  if(checkinDay > 7) checkinDay = 1;

  localStorage.setItem("checkinDay", checkinDay);

  updateCheckinText();

  alert("You got " + reward + " coins!");
}
</script>

</body>
</html>
