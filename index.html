<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
 <title>Cyber Fox TEST 999</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f0f0f;
      color: white;
    }

    header {
      padding: 15px;
      text-align: center;
      background: #1a1a1a;
      font-size: 20px;
      font-weight: bold;
    }

    .home {
      padding: 20px;
      text-align: center;
    }

    .coin-box {
      margin-top: 20px;
      padding: 20px;
      background: #222;
      border-radius: 10px;
      font-size: 18px;
    }

    .nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      display: flex;
      background: #1a1a1a;
    }

    .nav button {
      flex: 1;
      padding: 15px;
      background: none;
      border: none;
      color: white;
      font-size: 14px;
    }

    .nav button:hover {
      background: #333;
    }
  </style>
</head>

<body>

<header>
  🦊 Cyber Fox V2
</header>

<div class="home">
  <h2>Home</h2>

  <div class="coin-box">
    💰 Coins: <span id="coin">0</span>
  </div>

  <br>
  <button onclick="addCoins(10)">➕ Earn 10 Coins</button>
</div>

<div class="nav">
  <button>Home</button>
  <button>Spin</button>
  <button>Tasks</button>
  <button>Wallet</button>
</div>

<!-- 🔥 FIREBASE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA2aFc2uxZr0eOLQgyxHUL5bRtg8I1iYUs"
    authDomain: "cyber-fox-7f9a4.firebaseapp.com",
    databaseURL: "https://cyber-fox-7f9a4-default-rtdb.firebaseio.com",
    projectId: "cyber-fox-7f9a4",
    storageBucket: "cyber-fox-7f9a4.firebasestorage.app",
    messagingSenderId: "612951080546",
    appId: "1:612951080546:web:13026f07bbacd2c3ccdb3b"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // user id
  let userId = localStorage.getItem("userId");

  if (!userId) {
    userId = "user_" + Math.floor(Math.random() * 999999999);
    localStorage.setItem("userId", userId);
  }

  let coins = 0;

  // load coins
  function loadCoins() {
    get(child(ref(db), "users/" + userId)).then((snapshot) => {
      if (snapshot.exists()) {
        coins = snapshot.val().coins || 0;
        document.getElementById("coin").innerText = coins;
      }
    });
  }

  // save coins
  function saveCoins() {
    set(ref(db, "users/" + userId), {
      coins: coins
    });
  }

  // add coins
  window.addCoins = function(amount) {
    coins += amount;
    document.getElementById("coin").innerText = coins;
    saveCoins();
  }
alert("JS OK");
  loadCoins();
</script>

</body>
</html>
