<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Fox V2 - Real Spin</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --text-color: #ffffff;
            --accent-orange: #ff6b00;
            --sub-text: #858585;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background: radial-gradient(circle at top, #1f1e26 0%, #0b0c10 80%);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            overflow: hidden;
        }

        /* Top Header Area */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            z-index: 10;
        }

        .project-info {
            display: flex;
            flex-direction: column;
        }

        .project-title {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .project-subtitle {
            font-size: 0.75rem;
            color: var(--sub-text);
            margin-top: 2px;
        }

        /* Minimalist Wallet Button in Corner */
        .wallet-corner-btn {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .wallet-icon-svg {
            width: 14px;
            height: 14px;
            fill: #ff9800; /* Sleek Web3 Gold/Orange */
        }

        .wallet-text {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Hamster Style Clean Token Display over the Wheel */
        .main-display {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-top: -20px;
        }

        .token-balance-container {
            text-align: center;
        }

        .token-amount {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .token-label {
            font-size: 0.8rem;
            color: var(--sub-text);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: -2px;
        }

        /* Premium Spin Wheel Container */
        .wheel-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Outer Glow/Border */
        .wheel-outer-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid rgba(255, 107, 0, 0.2);
            box-shadow: 0 0 30px rgba(255, 107, 0, 0.25);
            pointer-events: none;
        }

        /* The Actual Turning Wheel */
        .spin-wheel {
            width: 92%;
            height: 92%;
            border-radius: 50%;
            background: conic-gradient(
                #1c1b22 0deg 45deg, #25242c 45deg 90deg,
                #1c1b22 90deg 135deg, #25242c 135deg 180deg,
                #1c1b22 180deg 225deg, #25242c 225deg 270deg,
                #1c1b22 270deg 315deg, #25242c 315deg 360deg
            );
            border: 6px solid #1a1921;
            position: relative;
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.3, 1);
            overflow: hidden;
        }

        /* Center Premium Logo Pin/Pointer */
        .wheel-center-pointer {
            position: absolute;
            width: 55px;
            height: 55px;
            background: radial-gradient(circle, #ff6b00 0%, #111 80%);
            border-radius: 50%;
            border: 3px solid #ff8c00;
            box-shadow: 0 0 15px rgba(255, 107, 0, 0.6);
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wheel-center-pointer img {
            width: 60%;
            height: 60%;
            object-fit: contain;
        }

        /* Lower Control Panel */
        .control-panel {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .key-status {
            font-size: 0.9rem;
            color: #ffcc00;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }

        .action-btn {
            width: 100%;
            background: linear-gradient(90deg, #ff6b00 0%, #ff8c00 100%);
            border: none;
            padding: 16px;
            border-radius: 14px;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 107, 0, 0.35);
            transition: transform 0.1s ease;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        /* Alert Popup */
        .custom-popup {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .popup-content {
            background: #1a1b22;
            border: 1px solid rgba(255,255,255,0.1);
            width: 80%;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
        }

        .popup-title {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .popup-text {
            color: var(--sub-text);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .popup-close-btn {
            background: var(--text-color);
            color: var(--bg-color);
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Header Section -->
        <div class="header">
            <div class="project-info">
                <span class="project-title">Cyber Fox</span>
                <span class="project-subtitle">Secure Matrix Node</span>
            </div>
            
            <!-- Clean Wallet Button Top Right Corner -->
            <div class="wallet-corner-btn" id="walletBtn">
                <svg class="wallet-icon-svg" viewBox="0 0 24 24">
                    <path d="M19 13H5v-2h14v2z M21 18c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V6c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v4h-9c-1.11 0-2 .9-2 2v2c0 1.1.89 2 2 2h9v4z"/>
                </svg>
                <span class="wallet-text">Connect</span>
            </div>
        </div>

        <!-- Main Display (Hamster Kombat Style Header + Spin Wheel) -->
        <div class="main-display">
            
            <!-- Clean Balance Display -->
            <div class="token-balance-container">
                <div class="token-amount" id="tokenDisplay">28,063</div>
                <div class="token-label">$FOX Tokens</div>
            </div>

            <!-- Premium Spin Wheel Structure -->
            <div class="wheel-wrapper">
                <div class="wheel-outer-ring"></div>
                <div class="wheel-center-pointer">
                    <!-- High quality fallback crypto badge vector icon -->
                    <img src="https://img.icons8.com/neon/96/fox.png" alt="Fox Pin">
                </div>
                <div class="spin-wheel" id="wheel">
                    <!-- Visual Segments can be added or customized via CSS/Images later -->
                </div>
            </div>

        </div>

        <!-- Lower Control Area -->
        <div class="control-panel">
            <div class="key-status">
                🔑 Available Keys: <span id="keyDisplay">2</span>
            </div>
            <button class="action-btn" id="spinBtn">Launch Premium Spin</button>
        </div>

    </div>

    <!-- Alert Popup System -->
    <div class="custom-popup" id="alertPopup">
        <div class="popup-content">
            <div class="popup-title" id="popupTitle">Notification</div>
            <div class="popup-text" id="popupMessage">Message info.</div>
            <button class="popup-close-btn" id="popupClose">OK</button>
        </div>
    </div>

    <script>
        // App Core State
        let userState = {
            tokens: 28063,
            keys: 2
        };

        const tokenDisplay = document.getElementById('tokenDisplay');
        const keyDisplay = document.getElementById('keyDisplay');
        const spinBtn = document.getElementById('spinBtn');
        const wheel = document.getElementById('wheel');
        const alertPopup = document.getElementById('alertPopup');
        const popupTitle = document.getElementById('popupTitle');
        const popupMessage = document.getElementById('popupMessage');
        const popupClose = document.getElementById('popupClose');

        let isSpinning = false;

        function updateUI() {
            tokenDisplay.innerText = userState.tokens.toLocaleString();
            keyDisplay.innerText = userState.keys;
        }

        function showPopup(title, message) {
            popupTitle.innerText = title;
            popupMessage.innerText = message;
            alertPopup.style.display = 'flex';
        }

        popupClose.addEventListener('click', () => {
            alertPopup.style.display = 'none';
        });

        // Real Spin Logic: Just needs keys!
        spinBtn.addEventListener('click', () => {
            if (isSpinning) return;

            if (userState.keys > 0) {
                isSpinning = true;
                userState.keys -= 1;
                updateUI();

                // Generate random full rotations + final stop angle
                const randomDeg = Math.floor(Math.random() * 360) + 1800; // 5 full spins minimum
                wheel.style.transform = `rotate(${randomDeg}deg)`;

                // Wait for the css animation to end (4 seconds)
                setTimeout(() => {
                    isSpinning = false;
                    
                    const wonTokens = [1000, 2500, 5000, 10000][Math.floor(Math.random() * 4)];
                    userState.tokens += wonTokens;
                    
                    updateUI();
                    showPopup("🎰 Spin Reward", `Successfully spent 1 Key. You received +${wonTokens} $FOX!`);
                }, 4000);

            } else {
                showPopup("Insufficient Keys", "You don't have enough keys left to trigger the premium spin matrix.");
            }
        });

        updateUI();
    </script>
</body>
                                                                  </html>
