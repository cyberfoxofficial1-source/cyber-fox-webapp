<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Fox</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
background:#07142e;
color:white;
overflow-x:hidden;
padding-bottom:100px;
}

/* Loading */

#loading{
position:fixed;
width:100%;
height:100%;
background:#07142e;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
}

.loader{
width:80px;
height:80px;
border-radius:50%;
border:8px solid #1f3f80;
border-top:8px solid #38bdf8;
animation:spin 1s linear infinite;
box-shadow:0 0 30px #38bdf8;
}

.loading-text{
margin-top:20px;
font-size:25px;
font-weight:bold;
color:#38bdf8;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

/* App */

#app{
display:none;
padding:20px;
text-align:center;
}

.title{
font-size:45px;
font-weight:bold;
margin-top:10px;
}

.balance{
font-size:50px;
font-weight:bold;
color:#38bdf8;
margin-top:20px;
text-shadow:0 0 20px #38bdf8;
}

.level{
margin-top:10px;
font-size:25px;
}

/* Fox */

#tapBtn{
width:260px;
height:260px;
border-radius:50%;
background:linear-gradient(145deg,#2563eb,#1d4ed8);
display:flex;
justify-content:center;
align-items:center;
margin:30px auto;
font-size:130px;
box-shadow:
0 0 30px #38bdf8,
0 0 70px #38bdf8;
animation:pulse 2s infinite;
transition:0.1s;
cursor:pointer;
user-select:none;
}

#tapBtn:active{
transform:scale(0.93);
}

@keyframes pulse{
0%{
box-shadow:0 0 20px #38bdf8;
}
50%{
box-shadow:
0 0 40px #38bdf8,
0 0 90px #38bdf8;
}
100%{
box-shadow:0 0 20px #38bdf8;
}
}

/* Buttons */

.btn{
width:100%;
padding:18px;
border:none;
border-radius:18px;
margin-top:15px;
font-size:22px;
font-weight:bold;
background:#2563eb;
color:white;
box-shadow:0 0 20px rgba(37,99,235,0.5);
}

/* Cards */

.card{
background:#0f172a;
padding:20px;
border-radius:20px;
margin-top:20px;
box-shadow:0 0 15px rgba(0,0,0,0.4);
}

.card-title{
font-size:28px;
margin-bottom:15px;
color:#38bdf8;
}

/* Task */

.task{
background:#1e293b;
padding:15px;
border-radius:15px;
margin-top:10px;
font-size:18px;
}

/* Floating + */

.plusOne{
position:absolute;
font-size:45px;
font-weight:bold;
color:#38bdf8;
animation:floatUp 0.8s linear forwards;
pointer-events:none;
}

@keyframes floatUp{
0%{
opacity:1;
transform:translateY(0);
}
100%{
opacity:0;
transform:translateY(-120px);
}
}

</style>
</head>

<body>

<!-- Loading -->

<div id="loading">

<div class="loader"></div>

<div class="loading-text">
CYBER FOX
</div>

</div>

<!-- App -->

<div id="app">

<div class="title">
🦊 Cyber Fox
</div>

<div class="balance" id="foxCount">
0 FOX
</div>

<div class="level" id="level">
Level 1 / 50
</div>

<!-- Fox -->

<div id="tapBtn">
🦊
</div>

<!-- Booster -->

<button class="btn" id="boosterBtn">
⚡ Booster (50 FOX)
</button>

<!-- Wallet -->

<div class="card">

<div class="card-title">
💳 Connect Wallet
</div>

<button class="btn">
Connect TON Wallet
</button>

</div>

<!-- Referral -->

<div class="card">

<div class="card-title">
👥 Referral
</div>

<p>
Invite Friends & Earn 500 FOX
</p>

<button class="btn">
Copy Referral Link
</button>

</div>

<!-- Spin -->

<div class="card">

<div class="card-title">
🎰 Daily Spin
</div>

<button class="btn" onclick="spinReward()">
Spin & Win
</button>

</div>

<!-- Invest -->

<div class="card">

<div class="card-title">
💰 Invest Card
</div>

<p>
Invest FOX & Earn Every Second
</p>

<button class="btn" onclick="buyMiner()">
Buy Miner (500 FOX)
</button>

<p style="margin-top:10px;" id="minerText">
Profit: +0/sec
</p>

</div>

<!-- Tasks -->

<div class="card">

<div class="card-title">
📋 Tasks
</div>

<div class="task">
🐦 Follow Twitter = +200 FOX
</div>

<div class="task">
▶ Subscribe YouTube = +300 FOX
</div>

<div class="task">
📢 Join Telegram Channel = +250 FOX
</div>

</div>

</div>

<script>

/* Loading */

setTimeout(() => {

document.getElementById("loading").style.display="none";

document.getElementById("app").style.display="block";

},2500);

/* Save */

let fox = localStorage.getItem("fox")
? parseInt(localStorage.getItem("fox"))
: 0;

let power = localStorage.getItem("power")
? parseInt(localStorage.getItem("power"))
: 1;

let level = localStorage.getItem("level")
? parseInt(localStorage.getItem("level"))
: 1;

let boosterCost = localStorage.getItem("boosterCost")
? parseInt(localStorage.getItem("boosterCost"))
: 50;

let miner = localStorage.getItem("miner")
? parseInt(localStorage.getItem("miner"))
: 0;

const foxCount=document.getElementById("foxCount");

const levelText=document.getElementById("level");

const boosterBtn=document.getElementById("boosterBtn");

const tapBtn=document.getElementById("tapBtn");

const minerText=document.getElementById("minerText");

/* Save Data */

function saveData(){

localStorage.setItem("fox",fox);

localStorage.setItem("power",power);

localStorage.setItem("level",level);

localStorage.setItem("boosterCost",boosterCost);

localStorage.setItem("miner",miner);

}

/* Update UI */

function updateUI(){

if(level>50){
level=50;
}

foxCount.innerHTML=fox+" FOX";

levelText.innerHTML=
"Level "+level+" / 50";

boosterBtn.innerHTML=
"⚡ Booster ("+boosterCost+" FOX)";

minerText.innerHTML=
"Profit: +"+miner+"/sec";

saveData();

}

/* Tap */

tapBtn.addEventListener("click",()=>{

fox += power;

if(level<50){
level += 1;
}

updateUI();

const plus=document.createElement("div");

plus.innerHTML="+"+power;

plus.classList.add("plusOne");

document.body.appendChild(plus);

plus.style.left=
(window.innerWidth/2-30)+"px";

plus.style.top=
(window.innerHeight/2)+"px";

setTimeout(()=>{

plus.remove();

},800);

});

/* Booster */

boosterBtn.addEventListener("click",()=>{

if(fox>=boosterCost){

fox-=boosterCost;

power+=1;

boosterCost+=50;

updateUI();

alert("🚀 Booster Upgraded!");

}else{

alert("Need More FOX");

}

});

/* Spin */

function spinReward(){

let reward=Math.floor(Math.random()*500)+100;

fox += reward;

updateUI();

alert("🎉 You Won "+reward+" FOX");

}

/* Miner */

function buyMiner(){

if(fox>=500){

fox-=500;

miner+=5;

updateUI();

alert("💰 Miner Activated!");

}else{

alert("Need 500 FOX");

}

}

/* Auto Profit */

setInterval(()=>{

fox += miner;

updateUI();

},1000);

updateUI();

</script>

</body>
</html>
