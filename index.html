<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Fox V2</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f0f0f;
  color:white;
  text-align:center;
}

header{
  padding:15px;
  background:#1a1a1a;
  font-size:22px;
  font-weight:bold;
}

.home{
  padding:20px;
}

.coin-box{
  margin:20px auto;
  padding:20px;
  background:#222;
  border-radius:10px;
  width:220px;
}

.fox-logo{
  width:280px;
  border-radius:50%;
  cursor:pointer;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.08);}
  100%{transform:scale(1);}
}

.nav{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  background:#1a1a1a;
}

.nav button{
  flex:1;
  padding:15px;
  background:none;
  border:none;
  color:white;
}
  .task-box{
  background:#222;
  margin:10px;
  padding:15px;
  border-radius:10px;
  }
</style>
</head>

<body>

<header>
🦊 Cyber Fox V2
</header>

<div id="home-page" class="home">

<h2>Home</h2>

<div class="coin-box">
💰 Coins: <span id="coin">0</span>
</div>

<img
class="fox-logo"
src="https://raw.githubusercontent.com/cyberfoxofficial1-source/cyber-fox-webapp/main/Orange%20Abstract%20Illustrative%20Esports%20Fox%20Gaming%20Logo_20260604_102333_0000.png"
onclick="addCoins(1)"
>

</div>
  <div id="tasks-page" style="display:none;">
<h2>📋 Tasks</h2>

<div class="task-box">
  <p>📢 Join Telegram Channel</p>

  <a href="https://t.me/CyberFoxOfficial" target="_blank">
    <button>Go</button>
  </a>
</div>

<div class="task-box">
  <p>👥 Join Telegram Group</p>
</div>

<div class="task-box">
  <p>🐦 Follow Twitter/X</p>
</div>

<div class="task-box">
  <p>📘 Follow Facebook Page</p>
</div>

<div class="task-box">
  <p>▶️ Subscribe YouTube</p>
</div>
    </div>
<div class="nav">
<button onclick="showHome()">Home</button>
<button>Spin</button>
<button onclick="showTasks()">Tasks</button>
<button>Wallet</button>
</div>

<script>

let coins = Number(localStorage.getItem("coins")) || 0;

document.getElementById("coin").innerText = coins;

function addCoins(amount){
  coins += amount;
  document.getElementById("coin").innerText = coins;
  localStorage.setItem("coins", coins);
}
function showHome(){
  document.getElementById("home-page").style.display = "block";
  document.getElementById("tasks-page").style.display = "none";
}
  function showTasks(){
  document.getElementById("home-page").style.display = "none";
  document.getElementById("tasks-page").style.display = "block";
}
</script>

</body>
</html>
