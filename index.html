<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Fox</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#050816;
color:white;
overflow-x:hidden;
}

.app{
max-width:500px;
margin:auto;
min-height:100vh;
padding-bottom:100px;
background:
radial-gradient(circle at top left,#102040,#050816 45%),
radial-gradient(circle at bottom right,#2d004d,#050816 40%);
}

.page{
display:none;
padding:20px;
animation:fade .3s ease;
}

.page.active{
display:block;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.profile{
display:flex;
align-items:center;
gap:10px;
}

.profile img{
width:45px;
height:45px;
border-radius:50%;
}

.level-box{
margin-top:10px;
}

.level-bar{
width:100%;
height:10px;
background:#222;
border-radius:30px;
overflow:hidden;
margin-top:5px;
}

.level-fill{
height:100%;
width:35%;
background:linear-gradient(90deg,#ff4df0,#8f5bff);
}

.pph{
background:#161b2d;
padding:12px 16px;
border-radius:20px;
font-size:14px;
}

.coin{
text-align:center;
margin-top:20px;
}

.coin h1{
font-size:45px;
margin-bottom:15px;
}

.fox{
width:240px;
height:240px;
border-radius:50%;
background:linear-gradient(135deg,#4f46e5,#2563eb);
display:flex;
justify-content:center;
align-items:center;
margin:auto;
font-size:120px;
box-shadow:0 0 50px #3b82f6;
animation:float 3s infinite ease-in-out;
cursor:pointer;
user-select:none;
}

@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0);}
}

.tap-text{
text-align:center;
margin-top:15px;
font-size:18px;
color:#aaa;
}

.card{
background:#12192d;
border-radius:22px;
padding:18px;
margin-top:18px;
box-shadow:0 0 20px rgba(0,0,0,.3);
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:15px;
}

.upgrade{
background:#1a2239;
padding:18px;
border-radius:18px;
}

.upgrade button{
margin-top:12px;
width:100%;
padding:10px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#ff00c8,#7b61ff);
color:white;
font-weight:600;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
max-width:500px;
margin:auto;
background:#0d1324;
display:flex;
justify-content:space-around;
padding:14px 5px;
border-top:1px solid #222;
z-index:999;
}

.nav-btn{
text-align:center;
font-size:13px;
color:#999;
cursor:pointer;
}

.nav-btn.active{
color:#ff4df0;
}

.loading{
position:fixed;
inset:0;
background:#050816;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:99999;
}

.loader{
width:90px;
height:90px;
border-radius:50%;
border:8px solid #222;
border-top:8px solid #7b61ff;
animation:rotate 1s linear infinite;
margin-bottom:20px;
}

@keyframes rotate{
to{
transform:rotate(360deg);
}
}

</style>
</head>

<body>

<div class="loading" id="loading">

<div class="loader"></div>

<h2>Loading Cyber Fox...</h2>

</div>

<div class="app">

<!-- HOME PAGE -->

<div class="page active" id="home">

<div class="top">

<div>

<div class="profile">

<img src="https://i.imgur.com/8Km9tLL.png">

<h2>Cyber Fox</h2>

</div>

<div class="level-box">

Level 12

<div class="level-bar">

<div class="level-fill"></div>

</div>

</div>

</div>

<div class="pph">

⚡ +85.6M PPH

</div>

</div>

<div class="coin">

<h1 id="coins">1500</h1>

<div class="fox" onclick="tapFox()">

🦊

</div>

<div class="tap-text">

Tap Fox To Earn

</div>

</div>

<div class="card">

<h3>Daily Combo</h3>

<div class="grid">

<div class="upgrade">

<h4>Market Boost</h4>

<p>+10M PPH</p>

<button>Upgrade</button>

</div>

<div class="upgrade">

<h4>Cyber Mining</h4>

<p>+25M PPH</p>

<button>Upgrade</button>

</div>

</div>

</div>

</div>
