<!DOCTYPE html>
<html>
<head>
<title>Cyber Fox</title>

<style>

body{
background:#020c2b;
color:white;
font-family:sans-serif;
text-align:center;
padding-top:40px;
margin:0;
overflow:hidden;
}

.balance{
font-size:40px;
margin:20px;
color:#38bdf8;
font-weight:bold;
}

.level{
font-size:24px;
margin-bottom:25px;
}

.fox{
width:190px;
height:190px;
margin:auto;
border-radius:50%;
background:#2563eb;
display:flex;
justify-content:center;
align-items:center;
font-size:110px;
box-shadow:0 0 45px #38bdf8;
transition:0.08s;
user-select:none;
cursor:pointer;
}

.fox:active{
transform:scale(0.92);
box-shadow:0 0 70px #38bdf8;
}

button{
margin-top:40px;
padding:16px;
font-size:20px;
border:none;
border-radius:15px;
background:#2563eb;
color:white;
width:260px;
font-weight:bold;
}

#effect{
position:absolute;
width:100%;
top:330px;
left:0;
pointer-events:none;
font-size:35px;
font-weight:bold;
color:#38bdf8;
}

</style>
</head>

<body>

<h1>🦊 Cyber Fox</h1>

<div class="balance" id="balance">
0 FOX
</div>

<div class="level" id="level">
Level 1
</div>

<div class="fox" onclick="mine()">
🦊
</div>

<div id="effect"></div>

<button onclick="boost()">
⚡ Booster (50 FOX)
</button>

<script>

let balance = localStorage.getItem("balance") || 0;
let level = localStorage.getItem("level") || 1;
let power = localStorage.getItem("power") || 1;

balance = parseInt(balance);
level = parseInt(level);
power = parseInt(power);

updateUI();

function updateUI(){

document.getElementById("balance").innerHTML =
balance + " FOX";

document.getElementById("level").innerHTML =
"Level " + level;

}

function saveData(){

localStorage.setItem("balance", balance);
localStorage.setItem("level", level);
localStorage.setItem("power", power);

}

function mine(){

balance += power;

updateUI();
saveData();

let effect = document.getElementById("effect");

effect.innerHTML = "+" + power;

effect.animate(

[
{transform:"translateY(0px)",opacity:1},
{transform:"translateY(-70px)",opacity:0}
],

{
duration:600
}

);

}

function boost(){

if(balance >= 50){

balance -= 50;
level += 1;
power += 1;

updateUI();
saveData();

alert("🚀 Booster Upgraded!");

}else{

alert("❌ Need 50 FOX");

}

}

</script>

</body>
</html>
