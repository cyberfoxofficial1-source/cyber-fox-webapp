<!DOCTYPE html>
<html>
<head>
<title>Cyber Fox</title>

<style>

body{
background:#020c2b;
color:white;
font-family:sans-serif;
text-align:center;
padding-top:40px;
}

.balance{
font-size:35px;
margin:20px;
color:#38bdf8;
font-weight:bold;
}

.level{
font-size:22px;
margin-bottom:25px;
}

.fox{
width:180px;
height:180px;
margin:auto;
border-radius:50%;
background:#2563eb;
display:flex;
justify-content:center;
align-items:center;
font-size:100px;
box-shadow:0 0 40px #38bdf8;
}

.fox:active{
transform:scale(0.9);
}

button{
margin-top:40px;
padding:15px;
font-size:20px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
width:250px;
}

</style>
</head>

<body>

<h1>🦊 Cyber Fox</h1>

<div class="balance" id="balance">
0 FOX
</div>

<div class="level" id="level">
Level 1
</div>

<div class="fox" onclick="mine()">
🦊
</div>

<button onclick="boost()">
⚡ Booster (50 FOX)
</button>

<script>

let balance = 0;
let level = 1;
let power = 1;

function mine(){

balance += power;

document.getElementById("balance").innerHTML =
balance + " FOX";

}

function boost(){

if(balance >= 50){

balance -= 50;
level += 1;
power += 1;

document.getElementById("balance").innerHTML =
balance + " FOX";

document.getElementById("level").innerHTML =
"Level " + level;

alert("🚀 Booster Upgraded!");

}else{

alert("Need 50 FOX");

}

}

</script>

</body>
</html>
