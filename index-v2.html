<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cyber Fox V2</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f0f0f;
      color: white;
    }

    header {
      padding: 15px;
      text-align: center;
      background: #1a1a1a;
      font-size: 20px;
      font-weight: bold;
    }

    .home {
      padding: 20px;
      text-align: center;
    }

    .coin-box {
      margin-top: 20px;
      padding: 20px;
      background: #222;
      border-radius: 10px;
      font-size: 18px;
    }

    .nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      display: flex;
      background: #1a1a1a;
    }

    .nav button {
      flex: 1;
      padding: 15px;
      background: none;
      border: none;
      color: white;
      font-size: 14px;
    }

    .nav button:hover {
      background: #333;
    }
  </style>
</head>

<body>

<header>
  🦊 Cyber Fox V2
</header>

<div class="home">
  <h2>Home</h2>

  <div class="coin-box">
    💰 Coins: <span id="coin">0</span>
  </div>
</div>

<div class="nav">
  <button>Home</button>
  <button>Spin</button>
  <button>Tasks</button>
  <button>Wallet</button>
</div>

<!-- 🔥 FIREBASE + LOGIC -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    databaseURL: "YOUR_DATABASE_URL",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // 👤 user id
  let userId = localStorage.getItem("userId");

  if (!userId) {
    userId = "user_" + Math.floor(Math.random() * 999999999);
    localStorage.setItem("userId", userId);
  }

  let coins = 0;

  // 📥 load coins
  function loadCoins() {
    const dbRef = ref(db);

    get(child(dbRef, "users/" + userId)).then((snapshot) => {
      if (snapshot.exists()) {
        coins = snapshot.val().coins || 0;
        document.getElementById("coin").innerText = coins;
      }
    });
  }

  // 💾 save coins
  function saveCoins() {
    set(ref(db, "users/" + userId), {
      coins: coins
    });
  }

  // ➕ add coins
  window.addCoins = function(amount) {
    coins += amount;
    document.getElementById("coin").innerText = coins;
    saveCoins();
  }

  loadCoins();
</script>

</body>
</html>
